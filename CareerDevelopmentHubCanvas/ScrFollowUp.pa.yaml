Screens:
  ScrFollowUp:
    Properties:
      Fill: =RGBA(252, 246, 233, 1)
      OnHidden: =Set(varPrefillContactId, "")
    Children:
      - conFlwRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(252, 246, 233, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conFlwTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(0, 72, 126, 1)
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =56
                  LayoutMinWidth: =0
                  PaddingLeft: =6
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - icoFlwBack:
                      Control: ModernIcon
                      Properties:
                        AccessibleLabel: ="Back"
                        AlignInContainer: =AlignInContainer.Center
                        Height: =44
                        Icon: ="ChevronLeft"
                        IconColor: =RGBA(252, 248, 240, 1)
                        IconStyle: =IconStyle.Filled
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =Set(varPrefillContactId, "");
                          Navigate(Screen1, ScreenTransition.UnCoverRight)
                        Width: =44
                  - txtFlwTitleBar:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="New follow-up"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(252, 248, 240, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="New follow-up"
                        Wrap: =false
            - conFlwBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(252, 246, 233, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                Children:
                  - conFlwFldTitle:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtFlwTitleLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="What needs doing, required"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="What needs doing? *"
                              Wrap: =false
                        - inpFlwTitle:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Follow-up title"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              MaxLength: =200
                              Placeholder: ="e.g. Send Priya my portfolio"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =15
                  - conFlwFldDue:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtFlwDueLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Due date, required"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Due date *"
                              Wrap: =false
                        - dpFlwDue:
                            Control: ModernDatePicker
                            Properties:
                              AccessibleLabel: ="Due date"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              DefaultDate: =Today()
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Placeholder: ="Pick a date"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =15
                  - conFlwFldType:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtFlwTypeLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Related to, required"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Related to *"
                              Wrap: =false
                        - ddFlwType:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="What this follow-up relates to"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              Default: |-
                                =If(
                                    varPrefillContactId <> "",
                                    { Label: "A contact", Val: 'Related Type (Follow Ups)'.Contact }
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              ItemDisplayText: =ThisItem.Label
                              Items: |-
                                =Table(
                                    { Label: "A contact", Val: 'Related Type (Follow Ups)'.Contact },
                                    { Label: "An application", Val: 'Related Type (Follow Ups)'.Application },
                                    { Label: "Nothing in particular", Val: 'Related Type (Follow Ups)'.'None/Standalone' }
                                )
                              OnChange: |-
                                =Reset(cmbFlwContact);
                                Reset(cmbFlwApp)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =15
                  - conFlwFldContact:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Contact
                      Children:
                        - txtFlwContactLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Contact, required"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Contact *"
                              Wrap: =false
                        - cmbFlwContact:
                            Control: ModernCombobox
                            Properties:
                              AccessibleLabel: ="Related contact"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              DefaultSelectedItems: |-
                                =If(
                                    varPrefillContactId <> "",
                                    Filter('Networking Contacts', cws_networkingcontactid = GUID(varPrefillContactId))
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              InputTextPlaceholder: ="Search contacts"
                              ItemDisplayText: =ThisItem.cws_contactname
                              Items: =SortByColumns('Networking Contacts', "cws_contactname", SortOrder.Ascending)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              SelectMultiple: =false
                              Size: =15
                  - conFlwFldApp:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Application
                      Children:
                        - txtFlwAppLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Application, required"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Application *"
                              Wrap: =false
                        - cmbFlwApp:
                            Control: ModernCombobox
                            Properties:
                              AccessibleLabel: ="Related job application"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              InputTextPlaceholder: ="Search applications"
                              ItemDisplayText: =ThisItem.cws_role & If(Len(ThisItem.cws_Company.cws_companyname) > 0, " - " & ThisItem.cws_Company.cws_companyname, "")
                              Items: =SortByColumns('Job Applications', "cws_role", SortOrder.Ascending)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              SelectMultiple: =false
                              Size: =15
                  - conFlwFldNotes:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 246, 233, 1)
                        FillPortions: =0
                        Height: =120
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtFlwNotesLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Notes"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 63, 78, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Notes"
                              Wrap: =false
                        - inpFlwNotes:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Follow-up notes"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              BorderColor: =RGBA(211, 201, 185, 1)
                              Color: =RGBA(8, 19, 28, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              Height: =96
                              MaxLength: =2000
                              Placeholder: ="Any detail you'll want later"
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =15
                              Type: =TextInputType.Multiline
                  - txtFlwStatusNote:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Saves as Open. Complete it from the home screen."
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(45, 63, 78, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: ="Saves as Open. Complete it from the home screen."
                        Wrap: =false
            - conFlwFooter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(211, 201, 185, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =76
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =76
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnFlwSave:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Save follow-up"
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =RGBA(0, 72, 126, 1)
                        Color: =RGBA(252, 248, 240, 1)
                        DisplayMode: |-
                          =If(
                              Len(Trim(inpFlwTitle.Text)) > 0
                                && !IsBlank(dpFlwDue.SelectedDate)
                                && !IsBlank(ddFlwType.Selected.Label)
                                && (
                                     ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.'None/Standalone'
                                     || (ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Contact
                                         && CountRows(cmbFlwContact.SelectedItems) > 0)
                                     || (ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Application
                                         && CountRows(cmbFlwApp.SelectedItems) > 0)
                                   ),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =160
                        OnSelect: |-
                          =Patch('Follow Ups', Defaults('Follow Ups'),
                              { cws_title: Trim(inpFlwTitle.Text),
                                cws_duedate: dpFlwDue.SelectedDate,
                                cws_status: 'Status (Follow Ups)'.Open,
                                cws_relatedtype: ddFlwType.Selected.Val,
                                cws_notes: inpFlwNotes.Text,
                                cws_RelatedContact: If(
                                    ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Contact,
                                    cmbFlwContact.Selected
                                ),
                                cws_RelatedApplication: If(
                                    ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Application,
                                    cmbFlwApp.Selected
                                ) }
                          );
                          Set(varSavedKind, "FollowUp");
                          Set(varSavedTitle, Trim(inpFlwTitle.Text));
                          Set(varSavedContactId,
                              If(ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Contact,
                                 Text(cmbFlwContact.Selected.cws_networkingcontactid),
                                 ""));
                          Set(varSavedContactName,
                              If(ddFlwType.Selected.Val = 'Related Type (Follow Ups)'.Contact,
                                 cmbFlwContact.Selected.cws_contactname,
                                 ""));
                          Set(varPrefillContactId, "");
                          Set(varReturnTo, "");
                          Navigate(ScrSaved, ScreenTransition.Fade)
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =16
                        Text: ="Save follow-up"
                        Width: =Parent.Width
